apiVersion: v1
kind: Pod
metadata:
  labels:
  name: nginx-pod
spec:
  containers:
  - image: nginx
    name: nginx-pod
    volumeMounts:
      - mountPath: /app/data
        name: mealie-storage
  - image: busybox
    name: busybox
    command: ["/bin/sh", "-c"]
    args: ["sleep 1000"]
  volumes:
    - name: mealie-storage
      persistentVolumeClaim:
        claimName: mealie-data
